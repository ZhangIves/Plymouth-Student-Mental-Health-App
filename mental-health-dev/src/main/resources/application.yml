#mysql
spring:
  profiles:
    active:
      - dev
  devtools:
    add-properties: false
    restart:
      enabled: false
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mental-health?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  sql:
    init:
      schema-locations:
        - classpath:sql/schema.sql
      data-locations: classpath:sql/data.sql
      platform: mysql
      mode: never
  redis:
    port: 6379
    host: localhost
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  mvc:
    static-path-pattern:/static/uploadImages/**
mybatis:
  mapper-locations:
    - classpath*:mapper/*.xml
  typeAliasesPackage: com.hctel.oos.login.entity
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto


